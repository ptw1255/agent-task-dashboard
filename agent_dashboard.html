<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Task Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2d;
            --bg-tertiary: #1e2738;
            --bg-hover: #252d41;
            --text-primary: #e4e8f0;
            --text-secondary: #9ca3af;
            --text-dim: #6b7280;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --border: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .agents-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .agent-category {
            margin-bottom: 16px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .category-header:hover {
            background: var(--bg-hover);
        }

        .category-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .category-count {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--bg-primary);
            border-radius: 10px;
            color: var(--text-dim);
        }

        .category-agents {
            display: none;
            margin-left: 8px;
        }

        .category-agents.expanded {
            display: block;
        }

        .agent-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .agent-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent-blue);
        }

        .agent-card.active {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .agent-search {
            padding: 0 16px 12px 16px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .agent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .agent-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .agent-status.idle {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .agent-status.busy {
            background: var(--accent-yellow);
            box-shadow: 0 0 8px var(--accent-yellow);
        }

        .agent-name {
            font-weight: 600;
            font-size: 14px;
            flex: 1;
        }

        .agent-type {
            font-size: 11px;
            padding: 2px 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .agent-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
        }

        .top-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-summary {
            display: flex;
            gap: 32px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-value.highlight {
            color: var(--accent-green);
        }

        /* Toolbar */
        .toolbar {
            padding: 16px 32px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filters {
            display: flex;
            gap: 12px;
        }

        .filter-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        /* Task Board */
        .task-board {
            flex: 1;
            display: flex;
            gap: 16px;
            padding: 32px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .column {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .column-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column-count {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .task-card.dragging {
            opacity: 0.5;
        }

        .task-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .task-priority.high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .task-priority.medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-yellow);
        }

        .task-priority.low {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .task-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .task-agent {
            font-size: 12px;
            color: var(--text-dim);
        }

        .task-agent.assigned {
            color: var(--accent-blue);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            padding: 32px;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    🤖 AI Agents
                </div>
                <div class="sidebar-subtitle">33 specialized agents</div>
            </div>
            <div class="agent-search">
                <input type="text" class="search-input" id="agentSearch" placeholder="🔍 Search agents...">
            </div>
            <div class="agents-list" id="agentsList">
                <!-- Agents will be rendered here -->
            </div>
        </div>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-content">
                    <div class="stats-summary">
                        <div class="stat-item">
                            <div class="stat-label">Total Tasks</div>
                            <div class="stat-value" id="statTotal">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Active Agents</div>
                            <div class="stat-value highlight" id="statActive">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Completion</div>
                            <div class="stat-value" id="statCompletion">0%</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="high">High Priority</button>
                    <button class="filter-btn" data-filter="medium">Medium Priority</button>
                    <button class="filter-btn" data-filter="low">Low Priority</button>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="refreshData()">
                        🔄 Refresh
                    </button>
                    <button class="btn btn-primary" onclick="showNewTaskModal()">
                        ➕ New Task
                    </button>
                </div>
            </div>

            <!-- Task Board -->
            <div class="task-board">
                <div class="column">
                    <div class="column-header">
                        <div class="column-title">
                            📋 Backlog
                            <span class="column-count" id="countBacklog">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="backlog" data-status="backlog">
                        <!-- Tasks will be rendered here -->
                    </div>
                </div>

                <div class="column">
                    <div class="column-header">
                        <div class="column-title">
                            ⚡ In Progress
                            <span class="column-count" id="countInProgress">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="in-progress" data-status="in-progress">
                        <!-- Tasks will be rendered here -->
                    </div>
                </div>

                <div class="column">
                    <div class="column-header">
                        <div class="column-title">
                            ✅ Done
                            <span class="column-count" id="countDone">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="done" data-status="done">
                        <!-- Tasks will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div class="modal" id="newTaskModal">
        <div class="modal-content">
            <div class="modal-header">Create New Task</div>
            <form id="newTaskForm">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-input" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="taskDescription"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Assign to Agent (Optional)</label>
                    <select class="form-select" id="taskAgent">
                        <option value="">Unassigned</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeNewTaskModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Global state
        let tasks = [];
        let agents = [];
        let selectedAgent = null;
        let currentFilter = 'all';

        // Initialize
        async function init() {
            await loadData();
            setupEventListeners();
            startAutoRefresh();
        }

        // Load data from API
        async function loadData() {
            try {
                const [tasksRes, agentsRes, statsRes] = await Promise.all([
                    fetch('/api/tasks'),
                    fetch('/api/agents'),
                    fetch('/api/stats')
                ]);

                tasks = await tasksRes.json();
                agents = await agentsRes.json();
                const stats = await statsRes.json();

                renderAgents();
                renderTasks();
                updateStats(stats);
                updateAgentSelect();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Refresh data
        async function refreshData() {
            await loadData();
        }

        // Render agents sidebar
        function renderAgents() {
            const container = document.getElementById('agentsList');
            const searchTerm = document.getElementById('agentSearch')?.value.toLowerCase() || '';

            // Group agents by category
            const categories = {
                'core': { name: '⚡ Core Agents', agents: [] },
                'superpowers': { name: '🦸 Superpowers', agents: [] },
                'feature-dev': { name: '🔧 Feature Dev', agents: [] },
                'feedback': { name: '📋 Feedback', agents: [] },
                'mcp': { name: '🔌 MCP', agents: [] }
            };

            // Filter and group agents
            agents.forEach(agent => {
                const matchesSearch = !searchTerm ||
                    agent.name.toLowerCase().includes(searchTerm) ||
                    agent.description.toLowerCase().includes(searchTerm) ||
                    agent.capabilities.some(cap => cap.toLowerCase().includes(searchTerm));

                if (matchesSearch && categories[agent.category]) {
                    categories[agent.category].agents.push(agent);
                }
            });

            // Render categories
            let html = '';
            Object.entries(categories).forEach(([categoryId, category]) => {
                if (category.agents.length === 0) return;

                const expanded = localStorage.getItem(`category-${categoryId}`) !== 'collapsed';

                html += `
                    <div class="agent-category">
                        <div class="category-header" onclick="toggleCategory('${categoryId}')">
                            <div class="category-title">${category.name}</div>
                            <div class="category-count">${category.agents.length}</div>
                        </div>
                        <div class="category-agents ${expanded ? 'expanded' : ''}" id="category-${categoryId}">
                            ${category.agents.map(agent => `
                                <div class="agent-card ${selectedAgent === agent.id ? 'active' : ''}"
                                     onclick="filterByAgent('${agent.id}')"
                                     title="${agent.description}">
                                    <div class="agent-header">
                                        <div class="agent-status ${agent.status}"></div>
                                        <div class="agent-name">${agent.name}</div>
                                    </div>
                                    <div class="agent-type">${agent.type}</div>
                                    <div class="agent-stats">
                                        <span>✓ ${agent.completedTasks}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Toggle category expand/collapse
        function toggleCategory(categoryId) {
            const categoryEl = document.getElementById(`category-${categoryId}`);
            const isExpanded = categoryEl.classList.contains('expanded');

            if (isExpanded) {
                categoryEl.classList.remove('expanded');
                localStorage.setItem(`category-${categoryId}`, 'collapsed');
            } else {
                categoryEl.classList.add('expanded');
                localStorage.setItem(`category-${categoryId}`, 'expanded');
            }
        }

        // Render tasks in columns
        function renderTasks() {
            const columns = {
                'backlog': document.getElementById('backlog'),
                'in-progress': document.getElementById('in-progress'),
                'done': document.getElementById('done')
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            // Filter tasks
            let filteredTasks = tasks;
            if (selectedAgent) {
                filteredTasks = tasks.filter(t => t.agent === selectedAgent);
            }
            if (currentFilter !== 'all') {
                filteredTasks = filteredTasks.filter(t => t.priority === currentFilter);
            }

            // Render tasks
            filteredTasks.forEach(task => {
                const agent = agents.find(a => a.id === task.agent);
                const card = document.createElement('div');
                card.className = 'task-card';
                card.draggable = true;
                card.dataset.taskId = task.id;
                card.innerHTML = `
                    <div class="task-priority ${task.priority}">${task.priority}</div>
                    <div class="task-title">${task.title}</div>
                    <div class="task-description">${task.description || 'No description'}</div>
                    <div class="task-footer">
                        <div class="task-agent ${task.agent ? 'assigned' : ''}">
                            ${task.agent ? `🤖 ${agent.name}` : 'Unassigned'}
                        </div>
                    </div>
                `;

                // Drag and drop handlers
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);

                const column = columns[task.status];
                if (column) column.appendChild(card);
            });

            // Update counts
            document.getElementById('countBacklog').textContent =
                filteredTasks.filter(t => t.status === 'backlog').length;
            document.getElementById('countInProgress').textContent =
                filteredTasks.filter(t => t.status === 'in-progress').length;
            document.getElementById('countDone').textContent =
                filteredTasks.filter(t => t.status === 'done').length;
        }

        // Update stats
        function updateStats(stats) {
            document.getElementById('statTotal').textContent = stats.totalTasks;
            document.getElementById('statActive').textContent = stats.activeAgents;
            document.getElementById('statCompletion').textContent = stats.completionRate + '%';
        }

        // Filter by agent
        function filterByAgent(agentId) {
            selectedAgent = selectedAgent === agentId ? null : agentId;
            renderAgents();
            renderTasks();
        }

        // Drag and drop
        let draggedElement = null;

        function handleDragStart(e) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        async function handleDrop(e, newStatus) {
            e.preventDefault();
            if (!draggedElement) return;

            const taskId = draggedElement.dataset.taskId;
            const task = tasks.find(t => t.id === taskId);
            if (!task || task.status === newStatus) return;

            // Update task status
            try {
                await fetch(`/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                await loadData();
            } catch (error) {
                console.error('Error updating task:', error);
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Agent search
            const searchInput = document.getElementById('agentSearch');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    renderAgents();
                });
            }

            // Priority filters
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTasks();
                });
            });

            // Drop zones
            document.querySelectorAll('.task-list').forEach(list => {
                list.addEventListener('dragover', handleDragOver);
                list.addEventListener('drop', (e) => handleDrop(e, list.dataset.status));
            });

            // New task form
            document.getElementById('newTaskForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createTask();
            });
        }

        // Show new task modal
        function showNewTaskModal() {
            document.getElementById('newTaskModal').classList.add('active');
        }

        // Close new task modal
        function closeNewTaskModal() {
            document.getElementById('newTaskModal').classList.remove('active');
            document.getElementById('newTaskForm').reset();
        }

        // Update agent select options
        function updateAgentSelect() {
            const select = document.getElementById('taskAgent');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Unassigned</option>' +
                agents.map(agent => `<option value="${agent.id}">${agent.name}</option>`).join('');
            select.value = currentValue;
        }

        // Create new task
        async function createTask() {
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;
            const agent = document.getElementById('taskAgent').value || null;

            try {
                await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        description,
                        priority,
                        agent,
                        status: 'backlog'
                    })
                });

                closeNewTaskModal();
                await loadData();
            } catch (error) {
                console.error('Error creating task:', error);
            }
        }

        // Auto-refresh every 30 seconds
        function startAutoRefresh() {
            setInterval(refreshData, 30000);
        }

        // Start the app
        init();
    </script>
</body>
</html>
